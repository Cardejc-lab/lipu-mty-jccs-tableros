/* Estándar lipu-dash · Lipu Monterrey: topbar navy · panel de filtros lateral colapsable · KPIs clicables · pestañas · gráficas · tablas jerárquicas · modales */
:root{
  /* Colores institucionales LiPU by Traxión: verde corporativo, fondo verde claro, amarillo de acento */
  --bg:#d9f3d0; --card:rgba(255,255,255,.84); --border:#c3dfb9; --line:#e3efdd;
  --navy:#066a38; --navy2:#05592f; --navy3:#0f7a44;
  --text:#0d2219; --ink2:#3d5446; --muted:#5f7a68; --muted2:#7f9887;
  --brand:#e8f20a; --brand2:#3b7d25; --brand3:#e8f20a;
  --foot:#3b7d25;
  --ok:#15803d; --ok-bg:#ecfdf3;
  --warn:#d97706; --warn-bg:#fffbeb;
  --bad:#b42318; --bad-bg:#fef3f2; --red:#e53e3e;
  --info:#2563eb; --info-bg:#eff6ff; --teal:#0891b2;
  --r:10px; --shadow:0 1px 3px rgba(13,34,25,.08),0 1px 2px rgba(13,34,25,.04);
  --font:"Inter",Arial,sans-serif;
  color-scheme:light;
}

.wm{position:fixed;left:calc(50% + 136px);top:58%;transform:translate(-50%,-50%);width:min(70vw,900px);aspect-ratio:769/312;background:url("DATAURI") center/contain no-repeat;opacity:.13;pointer-events:none;z-index:0}
.layout{position:relative;z-index:1}
.logoL{height:40px;width:auto;flex:none}
.logoR{height:40px;width:auto;flex:none;margin-left:auto}
@media (max-width:1330px){.logoR{display:none}}
.foot-bar{position:relative;z-index:1;background:var(--foot);color:var(--brand);text-align:center;font-weight:700;font-size:12.5px;letter-spacing:.04em;border-top:2px solid var(--text);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:700px){.logoR{display:none}.logoL{height:30px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:#fff;border-bottom:3px solid var(--brand);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.burger{background:var(--navy3);border:1px solid #2f8a55;color:#fff;border-radius:8px;width:36px;height:34px;cursor:pointer;font-size:16px;flex:none}
.ttl{display:flex;flex-direction:column;min-width:0;flex:1 1 140px}
.ttl h1{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.ttl small{color:var(--brand3);font-size:12px;font-weight:600;letter-spacing:.02em}
.badge{display:inline-flex;align-items:center;gap:7px;background:var(--navy2);border:1px solid var(--navy3);border-radius:999px;padding:5px 11px;font-size:12px;color:#e3f3e3;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.dot.amber{background:#e9a23b}.dot.red{background:var(--red)}
.tbtn{background:var(--navy3);border:1px solid #2f8a55;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.tbtn:hover{background:#0a7d43}
.tbtn.green{background:var(--brand);border-color:var(--brand);color:#13200a;font-weight:600}
.tbtn.green:hover{background:var(--brand3)}
.alertbtn{background:var(--red);border-color:var(--red);font-weight:600}
.alertbtn:hover{background:#c53030}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
.layout.collapsed{grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);max-height:calc(100vh - 60px);overflow:auto;background:var(--navy2);color:#e3f3e3;
  padding:14px 14px 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--navy3)}
.layout.collapsed .side{display:none}
.side h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand3);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.side .clr{background:transparent;border:1px dashed #3f8f5e;color:#e3f3e3;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;text-align:left}
.side .clr:hover{border-color:var(--brand)}
.fs{display:flex;flex-direction:column;gap:4px}
.fs label,.ms summary .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#c6e3c9;font-weight:600}
.fs input{width:100%;border:1px solid var(--navy3);background:var(--navy);color:#fff;border-radius:8px;padding:7px 9px;font-size:13px}
.fs input::placeholder{color:#a9d3ae}
.ms{border:1px solid var(--navy3);border-radius:8px;background:var(--navy)}
.ms summary{list-style:none;cursor:pointer;padding:7px 9px;display:flex;flex-direction:column;gap:1px}
.ms summary::-webkit-details-marker{display:none}
.ms summary .val{font-size:13px;color:#fff;display:flex;justify-content:space-between;gap:6px}
.ms summary .val::after{content:"▾";color:#c6e3c9}
.ms[open] summary .val::after{content:"▴"}
.ms .opts{border-top:1px solid var(--navy3);max-height:220px;overflow:auto;padding:4px 0}
.ms .opt{display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:12.5px;cursor:pointer}
.ms .opt:hover{background:var(--navy2)}
.ms .opt input{accent-color:var(--brand)}
.ms .opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms .opt em{font-style:normal;color:#b9dcbc;font-variant-numeric:tabular-nums;font-size:11px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid #3f8f5e;background:transparent;color:#e3f3e3;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.qchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#13200a;font-weight:600}
.side .note{font-size:11.5px;color:#8a94ad;margin:0}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.layout:not(.collapsed) main{padding-left:16px}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:var(--r);padding:12px 14px;font-size:13px}
.alert.info{background:var(--info-bg);border-color:var(--info);color:var(--info)}
.alert .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.abtn{border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:5px 10px;cursor:pointer;font-weight:600;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--k,var(--navy3))}
.kpi:hover{border-color:var(--muted2)}
.kpi:focus-visible{outline:2px solid var(--brand)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .c{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tag{align-self:flex-start;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-mute{background:var(--line);color:var(--ink2)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 6px}
.tab{border:0;background:transparent;padding:11px 13px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--brand)}
.tab .n{background:var(--line);color:var(--ink2);border-radius:999px;padding:1px 8px;font-size:11px;font-variant-numeric:tabular-nums}
.tab .n.red{background:var(--bad-bg);color:var(--bad)}
.tab[aria-selected="true"] .n{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.chead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead .ic{width:28px;height:28px;border-radius:8px;background:var(--navy);color:var(--brand);display:grid;place-items:center;font-size:14px;flex:none}
.chead h3{margin:0;font-size:15px;font-weight:700}
.chead .meta{color:var(--muted);font-size:12px}
.chead .cnt{background:var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.chead .sp{flex:1}
.xbtn{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.xbtn:hover{border-color:var(--muted)}
.explain{margin:0;padding:10px 14px;color:var(--ink2);font-size:12.5px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink2);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tscroll{overflow:auto;max-height:620px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;font-weight:600;font-size:11.5px;padding:0;white-space:nowrap;z-index:1}
thead th button{all:unset;cursor:pointer;display:block;padding:9px 10px;width:100%;box-sizing:border-box}
thead th button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
thead th .ar{color:var(--brand3);margin-left:4px}
tbody td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:#f1faee}
tbody tr.grp td{background:#e6f4e0;font-weight:700;cursor:pointer;color:var(--navy)}
tbody tr.grp:hover td{background:#dcefd5}
tbody tr.sub td:first-child{padding-left:22px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrapc{white-space:normal;min-width:240px}
.rank-badge{display:inline-grid;place-items:center;min-width:24px;height:20px;border-radius:6px;background:var(--line);color:var(--ink2);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 4px}
.rank-badge.r1{background:var(--navy);color:var(--brand)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;color:#fff}
.pill.dk{color:#3a2a00}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--warn);font-weight:600}.okt{color:var(--ok);font-weight:600}
.mbar{display:flex;align-items:center;gap:6px;min-width:130px}
.mbar .t{flex:1;height:7px;background:var(--line);border-radius:999px;position:relative;overflow:hidden}
.mbar .t i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.foot{color:var(--muted2);font-size:12px;margin:0}
.rtop{padding:14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.rtop h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.mini .kpi{padding:10px 12px}
.mini .kpi .v{font-size:24px}
.mx{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.mx table{font-size:12.5px}
.mx th,.mx td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.mx thead th{position:static;padding:8px 10px}
.mx tbody tr:last-child td{font-weight:700;background:#e6f4e0}
.brg{display:flex;flex-direction:column;gap:4px}
.brr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(120px,2fr) 70px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.brr:hover{background:#f1faee}
.brr:focus-visible{outline:2px solid var(--brand)}
.brr .bl{font-size:13px;font-weight:600;min-width:0}
.brr .bl small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.brr .bt{height:14px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.brr .bt i{position:absolute;top:0;bottom:0;border-radius:4px}
.brr .bn{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.brr.tot .bl,.brr.fin .bl{font-size:14px}
.brr.fin{border-top:2px solid var(--navy);border-radius:0;padding-top:8px}
.bside{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width:620px){.brr{grid-template-columns:1fr 60px}.brr .bt{grid-column:1/-1;grid-row:2}}
.integ{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);gap:6px 14px;align-items:center}
.icol{display:flex;flex-direction:column;gap:2px;min-width:0;align-self:stretch}
.icol.left > .il{flex:1;align-content:center}
.cmp{margin:6px 0 0;font-size:13px;font-weight:700;color:var(--navy);border-left:4px solid var(--brand);padding-left:8px}
.rtop .integ{box-shadow:none}
.il.tot.ok .lv{color:var(--ok)}
.il.sub{--c:var(--navy);background:#cfe9c4;border-left:6px solid var(--navy);border-top:2px solid var(--navy);border-bottom:2px solid var(--navy);border-radius:0 8px 8px 0;margin:4px 0 8px;box-shadow:0 1px 3px rgba(13,34,25,.12)}
button.il.sub:hover{background:#c2e2b5}
.il.sub .ll{color:var(--navy);font-weight:800;font-size:13px}
.il.sub .lv{font-size:26px;color:var(--navy)}
.il.sub .ls{color:var(--ink2);font-weight:600}
.integ .icol.left .il .ll{font-size:22px;letter-spacing:.03em;align-self:center}
.integ .icol.left .il .ls{font-size:14px}.il.tot.bad .lv{color:var(--bad)}
.ih{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.il{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:baseline;padding:8px 10px;border-radius:8px;border-left:4px solid var(--c,var(--navy3))}
button.il{cursor:pointer}button.il:hover{background:#f1faee}button.il:focus-visible{outline:2px solid var(--brand)}
.il .ll{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink2)}
.il .lv{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.il .ls{grid-column:1/-1;font-size:12px;color:var(--muted)}
.il.ok{--c:#5FA36F}.il.ok .lv{color:var(--ok)}
.il.bad{--c:#AE2F25}.il.bad .lv{color:var(--bad)}
.il.tot{border-top:2px solid var(--navy);border-radius:0 0 8px 8px;margin-top:2px}
.il.comp .lv{font-size:22px}
.il .ib{grid-column:1/-1;height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:4px}
.il .ib i{display:block;height:100%;background:var(--c)}
.ibr{align-self:stretch;border:2px solid var(--navy3);border-right:none;border-radius:12px 0 0 12px;margin:28px 0 8px;position:relative}.ibr::before{content:"";position:absolute;left:-14px;top:var(--t,50%);width:12px;border-top:2px solid var(--navy3)}
@media (max-width:700px){.integ{grid-template-columns:minmax(0,1fr)}.ibr{display:none}}
main,.rtop{container-type:inline-size}
.integ.fam{grid-template-columns:minmax(0,1fr)}
@container (min-width:1060px){.integ.fam{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)} .integ.fam .wfbox{grid-column:auto}}
.wfbox{grid-column:1/-1;min-width:0;display:flex;flex-direction:column;border-top:3px solid var(--navy);padding-top:12px;margin-top:8px}
.wf{position:relative;height:300px}
@container (min-width:1060px){
  .integ{grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) minmax(0,1.05fr)}
  .wfbox{grid-column:auto;align-self:stretch;border-top:none;border-left:3px solid var(--navy);padding:0 0 0 18px;margin:0}
  .wf{height:auto;flex:1;min-height:300px}
}
.split{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.split .sg{all:unset;box-sizing:border-box;cursor:pointer;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.split .sg:hover{filter:brightness(1.08)}
.split .sg:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.mxb{all:unset;cursor:pointer;color:var(--info);font-weight:600;font-variant-numeric:tabular-nums}
.mxb:hover{text-decoration:underline}
.mxb:focus-visible{outline:2px solid var(--brand)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px;padding:14px}
.chbox{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chbox h4{margin:0;font-size:13px;font-weight:700}
.chbox .sub{font-size:12px;color:var(--muted)}
.cv{position:relative;height:300px}
.cv.tall{height:420px}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:60;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:#fff;border-radius:12px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.mhead{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--navy);color:#fff;border-bottom:3px solid var(--brand)}
.mhead h4{margin:0;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbody{overflow:auto}
.mbody .pad{padding:8px 16px 16px}
.mbody .tscroll{max-height:none}
.kv{display:grid;grid-template-columns:minmax(130px,36%) 1fr;border-bottom:1px solid var(--line);font-size:13px}
.kv dt{color:var(--muted);padding:7px 8px 7px 0;font-size:12px}
.kv dd{margin:0;padding:7px 0;word-break:break-word}
.msec{margin:14px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--brand2);font-weight:700}
.loader{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:16px;text-align:center}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(300px,86vw);max-height:none;padding-top:calc(env(safe-area-inset-top,0px) + 14px);box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .layout:not(.collapsed) main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:45}
}
@media (min-width:861px){.scrim{display:none}}
@media print{
  .top,.side,.scrim,.tabs,.chips,.xbtn,.loader{display:none!important}
  .layout{display:block}.tscroll{max-height:none;overflow:visible}body{background:#fff}
}

.kc{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:2px solid var(--navy);border-radius:8px;padding:8px 10px 9px;text-align:center;display:flex;flex-direction:column;gap:1px;min-width:0;box-shadow:var(--shadow)}
.kc:hover{box-shadow:0 2px 8px rgba(13,34,25,.18)}
.kc:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kc .l{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kc .v{font-size:31px;font-weight:800;line-height:1.12;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kc .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kstrip.red .kc{background:var(--rose);border-color:var(--rose-b)}
.kstrip.red .kc .l{color:#4a0d0d}.kstrip.red .kc .c{color:#5c1a1a}
.dgrid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.pnl{grid-column:span 12;background:var(--card);border:2px solid var(--navy);border-radius:6px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pnl > .ph{display:flex;align-items:center;gap:8px;padding:7px 10px 5px}
.pnl > .ph h3{flex:1;margin:0;text-align:center;font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);text-wrap:balance}
.pnl.red{border-color:var(--rose-b)}
.pnl.red > .ph{background:var(--red-h)}
.pnl.red > .ph h3{color:#fff}
.pnl.red > .ph .xbtn{background:#fff}
.pnl .pb{padding:6px 10px 10px;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pnl .sub{font-size:11.5px;color:var(--muted);text-align:center}
.pnl .cv{height:290px}
.pnl .cv.tall{height:360px}
.pnl .tscroll{max-height:420px}
.pnl.red thead th{background:#7a1517}
tfoot td{position:sticky;bottom:0;background:#e6f4e0;font-weight:800;padding:7px 10px;border-top:2px solid var(--navy);white-space:nowrap;color:var(--navy)}
.pnl.red tfoot td{background:#fbe9ea;border-top-color:var(--rose-b);color:#4a0d0d}
@media (min-width:1000px){.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}}
@media (min-width:700px) and (max-width:999px){.s3,.s4,.s5,.s6{grid-column:span 6}.s7,.s8,.s9{grid-column:span 12}}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;font-size:12.5px;color:var(--ink2)}
.ctl b{color:var(--text)}
.grpsel{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.grpsel button{border:0;background:transparent;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink2);font-weight:600}
.grpsel button[aria-pressed="true"]{background:var(--navy);color:#fff}
.tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:12px;color:var(--ink2)}
.tog i{width:28px;height:16px;border-radius:999px;background:var(--muted2);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-pressed="true"]{border-color:var(--navy);color:var(--navy)}
.tog[aria-pressed="true"] i{background:var(--ok)}
.tog[aria-pressed="true"] i::after{left:14px}
@media (prefers-reduced-motion:reduce){.tog i,.tog i::after{transition:none}}
.lmap{height:300px;border-radius:4px;background:#eef4ea;z-index:0}
.lmap.big{height:600px}
.leaflet-container{font-family:var(--font);background:#eef4ea}
.mleg{background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:11px;color:var(--ink2);line-height:1.5;box-shadow:var(--shadow)}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mtip{font:12px var(--font)}
.mtip b{font-size:12.5px}
.det{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.det h4{margin:0;font-size:15px;color:var(--navy)}
.det .coord{color:var(--muted);font-variant-numeric:tabular-nums}
.mini2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mini2 div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.mini2 span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.mini2 b{font-size:18px;font-variant-numeric:tabular-nums}
.split{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.split i{display:block;height:100%}
.lnk{color:var(--info);font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}
.wkc{display:inline-grid;place-items:center;min-width:26px;height:20px;border-radius:5px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pnl.red td{padding:6px 8px}.pnl.red thead th button{padding:8px}.pnl td:first-child{max-width:230px}.pnl.s3 td:first-child{max-width:170px}
.shield{font:800 10px var(--font);color:#fff;background:#b45309;border:1.5px solid #fff;border-radius:5px;padding:1px 5px;box-shadow:0 1px 2px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-50%)}
.plab{font:700 11px var(--font);color:#0d2219;background:rgba(255,255,255,.92);border:1px solid #c3dfb9;border-radius:6px;padding:2px 6px;white-space:nowrap;box-shadow:0 1px 3px rgba(13,34,25,.2)}
.plab b{color:#AE2F25}
.mlab{font:700 10.5px var(--font);color:#8a7f70;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;transform:translate(-50%,-50%)}
.mleg .rl{display:inline-block;width:22px;height:5px;margin-right:5px;vertical-align:1px;background:repeating-linear-gradient(90deg,#2f2f2f 0 6px,#fff 6px 12px);border:1.5px solid #2f2f2f;border-left:0;border-right:0}
.leaflet-control-layers{font:12px var(--font);border-radius:8px!important}
.leaflet-control-layers-overlays label{margin:2px 0}
.mtt{border-radius:8px;border:1px solid #c3dfb9}
.leaflet-container{background:#ece8df}
.lmap.big{height:640px}
.nolist{font-size:12px;color:var(--ink2);margin:0;padding-left:18px;columns:2;column-gap:18px}
</style>

    const kv = iK >= 0 ? parseFloat(x[iK]) : NaN; st.km[j] = isFinite(kv) && kv >= 0 && kv <= 5 ? kv : NaN;

    let wk = wkCache.get(dn); if (wk === undefined) { wk = isoWeekKey(dn); wkCache.set(dn, wk); } st.wk[j] = wk;
    for (const k in STRCOLS) { let v = cI[k] >= 0 ? (x[cI[k]] || "").trim() : "";
      if (k === "nom") v = v.replace(/\.0+$/,"");
      if (k === "cr") v = v.replace(/^vias\s+/i, "");

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code:"timeout" }), ms))]); }
async function bytesToText(buf){
  let b = new Uint8Array(buf);

  if (b[0] === 0x1f && b[1] === 0x8b) {
    if (typeof DecompressionStream === "undefined") throw { code:"gzip" };
    return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }
  return new TextDecoder("utf-8").decode(b);
}

  { k:"jefe", l:"Jefe", col:"je" },
  { k:"coord", l:"Coordinador", col:"co" },
  { k:"oper", l:"Operador", col:"op" },
  { k:"unidad", l:"Unidad", col:"uni" },
  { k:"cruce", l:"Cruce", col:"cr" },
  { k:"cat", l:"Evento del cruce", get:i => D.cat[i], lab:v => CAT[v].l }

function hardTest(){
  const q = S.q.trim().toUpperCase();
  const qm = q ? Object.fromEntries(["uni","nom","op","cr"].map(k => [k, D.dict[k].map(s => s.toUpperCase().includes(q))])) : null;
  const sinop = S.chips.has("sinop"), sincad = S.chips.has("sincad"), noalto = S.chips.has("noalto");
  return i => !((noalto && D.cat[i] !== 0) || (sinop && D.op[i] !== 0) || (sincad && D.co[i] !== 0) || (qm && !(qm.uni[D.uni[i]] || qm.nom[D.nom[i]] || qm.op[D.op[i]] || qm.cr[D.cr[i]])));
}
/* Filas que pasan filtros activos (menos los de «skip») dentro de [d0, d1] */
function passRows(d0, d1, skip, extra){
  const act = FILTERS.filter(f => S.f[f.k].size && !(skip && skip.has(f.k))), ht = hardTest(), out = [];
  for (let i = 0; i < D.n; i++) { const dy = D.day[i]; if (dy < d0 || dy > d1) continue; if (!ht(i)) continue; if (extra && !extra(i)) continue;
    let ok = true; for (const f of act) if (!S.f[f.k].has(f.get(i))) { ok = false; break; } if (ok) out.push(i); }
  return out;
}
function compute(){
  const act = FILTERS.filter(f => S.f[f.k].size), ht = hardTest();
  const d0 = S.desde ?? -1e9, d1 = S.hasta ?? 1e9;
  const cnt = {}; FILTERS.forEach(f => cnt[f.k] = new Map());
  const out = new Int32Array(D.n); let m = 0;
  for (let i = 0; i < D.n; i++) {
    const dy = D.day[i]; if (dy < d0 || dy > d1) continue;
    if (!ht(i)) continue;
    let fails = 0, which = null;
    for (const f of act) if (!S.f[f.k].has(f.get(i))) { fails++; which = f; if (fails > 1) break; }
    if (fails > 1) continue;
    if (fails === 1) { const mp = cnt[which.k], v = which.get(i); mp.set(v, (mp.get(v)||0) + 1); continue; }
    out[m++] = i;
    for (const f of FILTERS) { const mp = cnt[f.k], v = f.get(i); mp.set(v, (mp.get(v)||0) + 1); }
  }
  IDX = out.subarray(0, m); OPTS = cnt;
  let mn = Infinity, mx = -Infinity; for (let j = 0; j < m; j++) { const dy = D.day[IDX[j]]; if (dy < mn) mn = dy; if (dy > mx) mx = dy; }
  const w0 = S.desde ?? (isFinite(mn) ? mn : D.min), w1 = Math.min(S.hasta ?? (isFinite(mx) ? mx : D.max), D.max);
  WIN = [w0, w1];
  const span = w1 - w0 + 1, p0 = w0 - span, p1 = w0 - 1;
  const P = newAgg();
  if (p1 >= D.min) passRows(p0, p1, DATEF).forEach(i => addAgg(P, i));

}
function newAgg(){ return { n:0, c:[0,0,0,0], dur:0, durV:0, nV:0, dmax:0, ops:new Set(), uni:new Set(), cr:new Set() }; }
const tProm = a => a.nV ? a.durV / a.nV : null;   /* tiempo promedio sin «posible paso del tren» */
function addAgg(a, i){ a.n++; a.c[D.cat[i]]++; a.dur += D.dur[i]; if (D.cat[i] < 3) { a.durV += D.dur[i]; a.nV++; } if (D.dur[i] > a.dmax) a.dmax = D.dur[i]; if (D.op[i]) a.ops.add(D.op[i]); a.uni.add(D.uni[i]); a.cr.add(D.cr[i]); }
function aggOf(list){ const a = newAgg(); for (let j = 0; j < list.length; j++) addAgg(a, list[j]); return a; }

function setPeriod(p, silent){

  else if (p === "w4") { S.desde = mx - dowOf(mx) - 21; S.hasta = mx; }
  else if (p === "m") { S.desde = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)/864e5); S.hasta = mx;
    if (mx - S.desde < 6) { S.desde = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()-1, 1)/864e5); } /* mes recién iniciado: incluye el anterior */ }
  else if (p === "m1") { S.desde = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()-1, 1)/864e5); S.hasta = Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)/864e5) - 1; }
  else { S.desde = null; S.hasta = null; }

function groupBy(list, keyFn){
  const mp = new Map();
  for (let j = 0; j < list.length; j++) { const i = list[j], k = keyFn(i); let a = mp.get(k); if (!a) { a = { k, n:0, c:[0,0,0,0], dur:0, durV:0, nV:0, dmax:0, durNo:0, km:0, idx:[], ops:new Set(), uni:new Set(), cr:new Set(), wk:new Map() }; mp.set(k, a); }
    a.n++; a.c[D.cat[i]]++; a.dur += D.dur[i]; if (D.cat[i] < 3) { a.durV += D.dur[i]; a.nV++; } if (D.dur[i] > a.dmax) a.dmax = D.dur[i]; if (D.km[i] === D.km[i]) a.km += D.km[i]; a.idx.push(i); if (D.op[i]) a.ops.add(D.op[i]); a.uni.add(D.uni[i]); a.cr.add(D.cr[i]);
    if (D.cat[i] === 0) { a.durNo += D.dur[i]; a.wk.set(D.wk[i], (a.wk.get(D.wk[i])||0) + 1); } }
  return [...mp.values()];
}
const score = a => a.c[0] * CONFIG.pesoScore.noAlto + a.c[1] * CONFIG.pesoScore.parcial;
const cumpl = a => pctV(a.c[2] + a.c[3], a.n);
function modeOf(a, col){ const mp = new Map(); for (const i of a.idx) { const v = D[col][i]; mp.set(v, (mp.get(v)||0)+1); } let b = 0, bv = -1; for (const [v,c] of mp) if (c > bv) { bv = c; b = v; } return D.dict[col][b] || ""; }
const filterIdx = fn => { const o = []; for (let j = 0; j < IDX.length; j++) if (fn(IDX[j])) o.push(IDX[j]); return o; };
function opRows(list){ return groupBy(list, i => D.op[i]).map(a => Object.assign(a, { op: D.dict.op[a.k] || "Sin operador", nom: modeOf(a, "nom"), pl: modeOf(a, "pl"), co: modeOf(a, "co"), je: modeOf(a, "je"), ge: modeOf(a, "ge") })); }

const TB = {};
function regTable(id, title, cols, rows, opts = {}){ TB[id] = { id, title, cols, rows, sort: TB[id]?.sort || opts.sort || null, click: opts.click || null, limit: opts.limit || 300, page: 0, foot: opts.foot || null }; return tableHTML(id); }
const xv = (c, r) => c.x ? c.x(r) : r[c.k];
function sortRows(t){ if (!t.sort) return t.rows; const c = t.cols.find(x => x.k === t.sort.k); if (!c) return t.rows; const dir = t.sort.desc ? -1 : 1;
  return [...t.rows].sort((a,b) => { const va = xv(c,a), vb = xv(c,b); if (va === vb) return 0; if (va === null || va === undefined || va === "N/A") return 1; if (vb === null || vb === undefined || vb === "N/A") return -1; return (typeof va === "number" && typeof vb === "number" ? va - vb : String(va).localeCompare(String(vb), "es")) * dir; }); }
function tableHTML(id){
  const t = TB[id], rows = sortRows(t), lim = t.limit, from = t.page * lim, vis = rows.slice(from, from + lim);
  const th = t.cols.map(c => `<th class="${c.num ? "num" : ""}"><button type="button" data-sort="${id}|${c.k}">${esc(c.l)}${t.sort && t.sort.k === c.k ? `<span class="ar">${t.sort.desc ? "▼" : "▲"}</span>` : ""}</button></th>`).join("");
  const tb = vis.length ? vis.map((r, j) => `<tr class="${t.click ? "row" : ""}" ${t.click ? `data-row="${id}|${from + j}"` : ""}>${t.cols.map(c => `<td class="${c.num ? "num" : ""}${c.wrap ? " wrapc" : ""}">${c.v ? c.v(r) : esc(r[c.k] ?? "–")}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${t.cols.length}" class="empty">Sin registros con los filtros actuales.</td></tr>`;
  const ft = t.foot && vis.length ? `<tfoot><tr>${t.cols.map((c, j) => `<td class="${c.num ? "num" : ""}">${t.foot[c.k] ?? (j === 0 ? "Total" : "")}</td>`).join("")}</tr></tfoot>` : "";
  const pg = rows.length > lim ? `<div class="pager">Mostrando ${fInt(from+1)}–${fInt(Math.min(from+lim, rows.length))} de ${fInt(rows.length)} <span style="flex:1"></span><button class="xbtn" type="button" data-pg="${id}|-1" ${t.page ? "" : "disabled"}>← Anterior</button><button class="xbtn" type="button" data-pg="${id}|1" ${from + lim < rows.length ? "" : "disabled"}>Siguiente →</button></div>` : "";

  return `<div class="tscroll" id="tb_${id}"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${ft}</table></div>${pg}`;

/* =================== KPIs (tarjetas tipo BI) =================== */
function delta(cur, prev, lowerIsBetter, isPct){
  if (prev === null || prev === undefined || cur === null) return "Sin periodo anterior";
  const d = cur - prev; if (Math.abs(d) < 1e-9) return "= vs periodo anterior";
  const good = lowerIsBetter ? d < 0 : d > 0; const txt = isPct ? `${nf1.format(Math.abs(d))} pts` : (prev ? `${nf1.format(Math.abs(d/prev*100))}%` : fInt(Math.abs(d)));

function weekWindow(){
  const end = Math.min(S.hasta ?? D.max, D.max), endMon = end - dowOf(end), start = endMon - 7 * (S.nw - 1);
  const lastDow = dowOf(end);
  const list = passRows(start, end, DATEF, S.comp ? (i => D.dow[i] <= lastDow) : null);
  const weeks = Array.from({ length:S.nw }, (_, j) => isoWeekKey(start + 7 * j));
  return { list, weeks, end, start, lastDow };
}
function pivot(id, title, list, keyFn, labF, weeks, opts = {}){
  const rows = groupBy(list, keyFn).filter(a => a.c[0]).map(a => Object.assign(a, { name: labF(a.k) }));
  const tot = new Map(); let T = 0; rows.forEach(r => { weeks.forEach(w => tot.set(w, (tot.get(w)||0) + (r.wk.get(w)||0))); T += r.c[0]; });
  const mx = Math.max(1, ...rows.flatMap(r => weeks.map(w => r.wk.get(w) || 0)));
  const cols = [{ k:"name", l:opts.l || "Nombre", x:r => r.name, v:r => r.k ? esc(r.name) : `<span class="tag t-mute">${esc(r.name)}</span>` },
    ...(opts.extra ? [opts.extra] : []),
    ...weeks.map(w => ({ k:"w" + w, l:String(w % 100), num:true, x:r => r.wk.get(w) || 0, v:r => { const n = r.wk.get(w) || 0; return n ? (opts.heat ? `<span class="wkc" style="${heatBg(n, mx)}">${fInt(n)}</span>` : fInt(n)) : "" ; } })),
    { k:"tot", l:"Total", num:true, x:r => r.c[0], v:r => `<b>${fInt(r.c[0])}</b>` }];
  const foot = { tot:`<b>${fInt(T)}</b>` }; weeks.forEach(w => foot["w" + w] = fInt(tot.get(w) || 0));
  return regTable(id, title, cols, rows, { sort:{ k:"tot", desc:true }, click:r => openEvents(`${r.name} · no alto`, r.idx.filter(i => D.cat[i] === 0)), foot, limit:200 });
}

    { k:"op", l:"Operador", x:r => r.op, v:r => `<b>${esc(r.op)}</b>` }, { k:"nom", l:"Nómina", x:r => r.nom, v:r => esc(r.nom || "–") }, { k:"pl", l:"Cliente", x:r => r.pl, v:r => esc(r.pl) },
    { k:"nW", l:"Semanas en rojo", num:true, x:r => r.nW, v:r => `<span class="tag ${r.nW >= 3 ? "t-bad" : "t-warn"}">${r.nW} de ${wks.length}</span>` },
    ...wks.map((w, j) => ({ k:"w" + j, l:wkLabel(w), num:true, x:r => r.per[j], v:r => r.per[j] ? `<span class="wkc" style="${heatBg(r.per[j], mx)}">${r.per[j]}</span>` : `<span style="color:var(--muted2)">–</span>` })),
    C_NOALTO, C_PNO,
    { k:"co", l:"Coordinador", x:r => r.co, v:r => r.co ? esc(r.co) : `<span class="tag t-mute">Sin asignación</span>` }, { k:"je", l:"Jefe", x:r => r.je, v:r => esc(r.je || "–") }, { k:"ge", l:"Gerente", x:r => r.ge, v:r => esc(r.ge || "–") },
    { k:"accion", l:"Acción sugerida", wrap:true, x:r => r.accion, v:r => esc(r.accion) }];
  const sinOp = filterIdx(i => !D.op[i]); const uniSin = groupBy(sinOp, i => D.uni[i]).sort((a,b) => b.n - a.n);
  const sinCad = opRows(IDX).filter(r => r.k && !r.co && r.c[0]);
  v.innerHTML = `<div class="view-pad"><p class="explain" style="border:0;padding:0">Operadores con eventos sin alto en <b>${CONFIG.umbrales.reincidencia} o más</b> de las últimas 4 semanas del periodo (${wks.map(wkLabel).join(", ")}), con su cadena de mando para dar seguimiento.</p><div class="dgrid">
    ${panel("red", "Reincidentes de no alto", regTable("rev", "Por revisar", cols, REV, { sort:{ k:"nW", desc:true }, click:r => openEvents(`${r.op} · no alto`, r.idx.filter(i => D.cat[i] === 0)) }), "rev")}
    ${panel("s6", "Cruces sin operador logueado", regTable("sinop", "Sin operador", [{ k:"u", l:"Unidad", x:r => D.dict.uni[r.k], v:r => `<b>${esc(D.dict.uni[r.k])}</b>` }, { k:"pl", l:"Cliente", x:r => modeOf(r, "pl"), v:r => esc(modeOf(r, "pl")) }, C_TOT, C_NOALTO], uniSin, { sort:{ k:"n", desc:true }, click:r => openEvents(`Unidad ${D.dict.uni[r.k]} sin operador`, r.idx), limit:100 }), "sinop", `${fInt(sinOp.length)} eventos no se pueden atribuir a nadie. Revisar el logueo en estas unidades.`)}
    ${panel("s6", "Operadores con no alto sin coordinador", regTable("sincad", "Sin coordinador", [{ k:"op", l:"Operador", x:r => r.op, v:r => esc(r.op) }, { k:"nom", l:"Nómina", x:r => r.nom, v:r => esc(r.nom || "–") }, { k:"pl", l:"Cliente", x:r => r.pl, v:r => esc(r.pl) }, C_NOALTO, C_TOT], sinCad, { sort:{ k:"no", desc:true }, click:r => openEvents(r.op, r.idx), limit:100 }), "sincad", "Su nómina no está en la hoja PLANTILLA. Actualízala para asignar coordinador, jefe y gerente.")}
  </div></div>`;
}

/* =================== Excel (SheetJS 0.18.5) =================== */
let DLS = null;
function showAlert(type, msg){ const el = document.createElement("div"); el.className = "alert" + (type === "info" ? " info" : ""); el.innerHTML = `<span>${msg}</span><span class="act"><button class="abtn" type="button">Cerrar</button></span>`; el.querySelector("button").onclick = () => el.remove(); $("#alerts").prepend(el); }
async function saveWb(wb, name){
  if (!window.XLSX || !wb) { showAlert("info", "La librería de Excel no cargó. Pulsa Recargar para exportar."); return; }
  const fname = `${name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"")}_LipuMty_${stamp()}.xlsx`;
  if (IN_CLAUDE) { if (!DLS) { try { DLS = await window.claude.use("downloads"); } catch(e){} }
    if (DLS) { try { await DLS.save({ filename:fname, data:new Uint8Array(XLSX.write(wb, { bookType:"xlsx", type:"array" })) }); } catch(e){ showAlert("info", "No se guardó el archivo: la descarga se canceló o no está permitida en esta vista."); } return; }
    showAlert("info", "Esta vista no permite descargar archivos. Abre el tablero desde el portal para exportar."); return; }
  XLSX.writeFile(wb, fname);
}
const sheetName = s => String(s || "Hoja").replace(/[:\\\/?*\[\]]/g, "-").replace(/\s+/g, " ").trim().slice(0,31) || "Hoja";
function plainV(c, r){ let v = xv(c, r); if (c.k === "f") return fDay(D.day[r.i]); if (c.k === "h") return fHms(D.sec[r.i]); if (c.k === "nW") return `${r.nW} de ${r.wks.length}`; if (c.k === "niv") return semNoAlto(v).l; if (v === null || v === undefined) return ""; if (typeof v === "number" && ["pno","tno"].includes(c.k)) return +v.toFixed(2); return v; }
function exportTable(id){
  const t = TB[id]; if (!t) return;
  if (!window.XLSX) return saveWb(null, t.title);
  const rows = t._sorted || sortRows(t); const MAXR = 150000;
  if (rows.length > MAXR) showAlert("info", `Se exportan las primeras ${fInt(MAXR)} filas de ${fInt(rows.length)}. Aplica más filtros para exportar el resto.`);
  try { const aoa = [t.cols.map(c => c.l), ...rows.slice(0, MAXR).map(r => t.cols.map(c => plainV(c, r)))];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName(t.title)); saveWb(wb, t.title); }
  catch (e) { showAlert("info", `No se pudo generar el Excel: ${esc(e.message || e)}`); }
}
$("#btnExcel").addEventListener("click", () => { const map = { noaltos:"opsNA", semana:"wOp", mapa:"mapOps", revisar:"rev", detalle:"det" }; let id = map[S.tab];
  if (!id) { TB.detx = null; regTable("detx", "Cruces ferroviarios", evCols(), Array.from(IDX, i => ({ i })), { sort:{ k:"f", desc:true } }); id = "detx"; }
  exportTable(id); });

  if (dat) loadFile(dat); });
/* Publicar para todos (solo administradores; Supabase valida el permiso) */
async function offerPublish(file, isGeo){
  if (!window.LIPU || !(await LIPU.isAdmin())) return;
  const path = isGeo ? CONFIG.ubicaciones : CONFIG.archivo;
  const el = document.createElement("div"); el.className = "alert info";
  el.innerHTML = `<span>Cargaste <b>${esc(file.name)}</b> solo en esta vista. ¿Quieres publicarlo para todos los usuarios del portal?</span><span class="act"><button class="abtn" type="button" data-pub>Publicar para todos</button><button class="abtn" type="button" data-no>Ahora no</button></span>`;
  el.querySelector("[data-no]").onclick = () => el.remove();
  el.querySelector("[data-pub]").onclick = async ev => { const b = ev.target; b.disabled = true; b.textContent = "Publicando…";
    try { let blob = file;
      if (!isGeo && !/\.gz$/i.test(file.name)) { if (typeof CompressionStream === "undefined") throw { msg:"Este navegador no puede comprimir; publica el archivo .csv.gz" }; blob = await new Response(file.stream().pipeThrough(new CompressionStream("gzip"))).blob(); }
      await LIPU.upload(path, blob, isGeo ? "application/json" : "application/gzip");
      el.className = "alert info"; el.innerHTML = `<span>Publicado. Desde ahora todos verán estos datos al abrir el tablero.</span>`; setTimeout(() => el.remove(), 6000);
    } catch (err) { b.disabled = false; b.textContent = "Reintentar"; showAlert("info", esc(err.msg || err.message || String(err))); } };
  $("#alerts").prepend(el);
}

try { if (localStorage.getItem("trx_sidebar_collapsed") === "1" || window.innerWidth <= 860) layout.classList.add("collapsed"); } catch(e){ if (window.innerWidth <= 860) layout.classList.add("collapsed"); }
{ const h = (location.hash || "").slice(1); if (TABS[h]) S.tab = h; }
