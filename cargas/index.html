<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cargas de datos · Lipu Mty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="../assets/lipu-auth.js"></script>
<style>
:root{--bg:#d9f3d0;--card:#fff;--border:#c3dfb9;--line:#e3efdd;--navy:#066a38;--navy3:#0f7a44;--text:#0d2219;--ink2:#3d5446;--muted:#5f7a68;--brand:#e8f20a;--bad:#b42318;--bad-bg:#fef3f2;--ok:#15803d;--ok-bg:#ecfdf3;--warn:#b45309;--warn-bg:#fffbeb;--r:12px;--font:"Inter",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{font:14px/1.45 var(--font);color:var(--text)}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--brand);padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font-size:17px;flex:1}
.top small{color:var(--brand);font-weight:600}
.top a{color:#fff;font-size:13px}
main{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:16px}
.card p{margin:0;color:var(--ink2)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.meta div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.meta span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.meta b{font-size:17px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{border-radius:8px;padding:9px 11px;font-size:13px}
.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:var(--navy);color:#fff;font-weight:600}
code{font-size:12px;background:var(--line);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<header class="top"><h1>Cargas de datos <small>· Lipu Monterrey</small></h1><span id="who"></span><a href="../">Volver al portal</a></header>
<main>
  <div class="msg err" id="gate" hidden></div>
  <div id="cards"></div>
</main>
<input type="file" id="fileIn" accept=".csv,.gz" hidden>
<script>
"use strict";
/* Tablas que se cargan desde los archivos exportados del Access (exportar_tabla_access.py).
   modo: "reemplazo" borra todo y carga; "ventana" agrega los días del archivo y borra lo anterior a N días. */
const T = {
  base_viajes_hoy: {
    titulo: "Viajes de hoy", fuente: "TABLA DRIVES HOY · CARGAR BASES PRINCIPALES.accdb", archivo: "tabla_drives_hoy.csv.gz", modo: "reemplazo", fecha: "inicio_recorrido",
    map: [
      ["id_viaje", "Núm Eco", "id"], ["num_economico", "Núm Económico", "id"], ["vin", "Número Serie (VIN)", "txt"], ["grupo_vehiculos", "Grupo de vehículos", "txt"],
      ["nombre_conductor", "Nombre del conductor", "txt"], ["codigo_dmas", "Código DMAS", "id"], ["grupo_conductores", "Grupo de conductores", "txt"], ["id_colaborador", "Id Colaborador", "id"],
      ["inicio_recorrido", "Inicio Recorrido", "ts"], ["ubicacion_inicial", "Ubicación Inicial", "txt"], ["lat_inicial", "Start latitud", "num"], ["lon_inicial", "Empiezo de longitud", "num"],
      ["fin_recorrido", "Fin Recorrido", "ts"], ["ubicacion_final", "Ubicación Final", "txt"], ["lat_final", "Latitud Final*", "num"], ["lon_final", "Longitud Final", "num"],
      ["kms_viaje", "Kilometraje", "num"], ["tiempo_manejo", "Tiempo Total de Manejo", "hms"], ["combustible", "Combustible Utilizado", "num"], ["rendimiento_kml", "Rendimiento (Km/L)", "num"],
      ["litros_100km", "Litros por 100 km", "num"], ["ralenti", "Ralentí", "hms"], ["kms_total", "Kilometraje Total", "num"], ["hrs_motor", "Hrs de Motor", "num"]
    ]
  },
  base_viajes: {
    titulo: "Viajes (2 meses a detalle)", fuente: "TABLA DE VIAJES TL · CARGAR BASES PRINCIPALES.accdb", archivo: "tabla_de_viajes_tl.csv.gz", modo: "ventana", fecha: "inicio_recorrido",
    map: [
      ["id_viaje", "Núm Eco", "id"], ["num_economico", "Núm Económico", "id"], ["vin", "Número Serie (VIN)", "txt"], ["grupo_vehiculos", "Grupo de vehículos", "txt"],
      ["nombre_conductor", "Nombre del conductor", "txt"], ["codigo_dmas", "Código DMAS", "id"], ["grupo_conductores", "Grupo de conductores", "txt"], ["id_colaborador", "Id Colaborador", "id"],
      ["inicio_recorrido", "Inicio Recorrido", "ts"], ["ubicacion_inicial", "Ubicación Inicial", "txt"], ["lat_inicial", "Start latitud", "num"], ["lon_inicial", "Empiezo de longitud", "num"],
      ["fin_recorrido", "Fin Recorrido", "ts"], ["ubicacion_final", "Ubicación Final", "txt"], ["lat_final", "Latitud Final*", "num"], ["lon_final", "Longitud Final", "num"],
      ["kms_viaje", "Kilometraje", "num"], ["tiempo_manejo", "Tiempo Total de Manejo", "hms"], ["combustible", "Combustible Utilizado", "num"], ["rendimiento_kml", "Rendimiento (Km/L)", "num"],
      ["litros_100km", "Litros por 100 km", "num"], ["ralenti", "Ralentí", "hms"], ["kms_total", "Kilometraje Total", "num"], ["hrs_motor", "Hrs de Motor", "num"],
      ["fecha_carga", "Fecha de Carga", "ts"]
    ]
  },
  base_eventos: {
    titulo: "Eventos (2 meses a detalle)", fuente: "TABLA DE EVENTOS TL · CARGAR BASES PRINCIPALES.accdb", archivo: "tabla_de_eventos_tl.csv.gz", modo: "ventana", fecha: "hora_inicio",
    nota: "Clasificación, severidad y peso se completan con catalogo_eventos; la nómina con catalogo_operadores (por nombre).",
    map: [
      ["nombre_conductor", "Nombre del conductor", "txt"], ["grupo_conductores", "Grupo de conductores", "txt"], ["num_economico", "Núm Económico", "id"], ["vin", "Número Serie (VIN)", "txt"],
      ["grupo_vehiculos", "Grupo de vehículos", "txt"], ["hora_inicio", "Hora Inicio", "ts"], ["ubicacion_inicial", "Ubicación Inicial", "txt"], ["lat_inicial", "Start latitud", "num"],
      ["lon_inicial", "Empiezo de longitud", "num"], ["direccion_grados", "DIRECCIÓN*", "id"], ["cat_evento", "Categoria del Evento", "txt"], ["tipo_evento", "Tipo de Evento", "txt"],
      ["hora_final", "Hora Final*", "ts"], ["ubicacion_final", "Ubicación Final", "txt"], ["lat_final", "Latitud Final*", "num"], ["lon_final", "Longitud Final", "num"],
      ["kms_evento", "Kilometraje", "num"], ["vel_evento", "Velocidad", "num"], ["vel_maxima", "Velocidad Máxima*", "num"], ["duracion_evento", "Duración", "hms"],
      ["obs_evento", "Observaciones del Evento*", "txt"], ["fecha_carga", "Fecha de Carga", "ts"]
    ]
  }
};
const VENTANA_DIAS = 62;   /* días de detalle que se conservan en base_viajes y base_eventos */
const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat("es-MX");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NUL = new Set(["", "--", "NA", "nan", "NaN", "null"]);
const CONV = {
  txt: v => NUL.has(String(v ?? "").trim()) ? null : String(v).trim(),
  id:  v => { const s = String(v ?? "").trim().replace(/\.0+$/, ""); return NUL.has(s) ? null : s; },
  num: v => { const n = parseFloat(v); return isFinite(n) ? n : null; },
  ts:  v => { const s = String(v ?? "").trim(); return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 19) : null; },
  hms: v => { const m = String(v ?? "").match(/(\d{1,2}):(\d{2}):(\d{2})\s*$/); return m ? `${m[1].padStart(2,"0")}:${m[2]}:${m[3]}` : null; }
};
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); f = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
async function readFile(file){
  const buf = await file.arrayBuffer(), b = new Uint8Array(buf);
  if (b[0] === 0x1f && b[1] === 0x8b) return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return new TextDecoder("utf-8").decode(b);
}
async function estado(tabla){
  const sb = LIPU.sb(), cfg = T[tabla];
  const { count, error } = await sb.from(tabla).select("id", { count:"exact", head:true });
  if (error) return { error: error.message };
  const ult = await sb.from(tabla).select(`fecha_carga, ${cfg.fecha}`).order("fecha_carga", { ascending:false }).limit(1);
  const r = (ult.data || [])[0] || {};
  return { count, carga: r.fecha_carga, ultimo: r[cfg.fecha] };
}
const fdt = s => s ? s.replace("T", " ").slice(0, 16) : "–";
async function render(){
  $("#cards").innerHTML = Object.entries(T).map(([k, c]) => `<section class="card" id="c_${k}">
    <h2>${esc(c.titulo)} <code>${k}</code></h2>
    <p>Fuente: ${esc(c.fuente)} → archivo <code>${esc(c.archivo)}</code>. Modo: <b>${c.modo === "reemplazo" ? "reemplazo completo (cada carga borra la anterior)" : "ventana móvil"}</b>.</p>
    <div class="meta" id="m_${k}"><div><span>Estado</span><b>Consultando…</b></div></div>
    <div class="row"><button class="btn" type="button" data-load="${k}">⇪ Cargar archivo</button><span class="muted" id="f_${k}"></span></div>
    <div id="p_${k}" hidden><div class="bar"><i id="b_${k}"></i></div></div>
    <div id="x_${k}"></div>
  </section>`).join("");
  for (const k of Object.keys(T)) {
    const e = await estado(k);
    $("#m_" + k).innerHTML = e.error ? `<div class="msg err">${esc(e.error)}</div>` : `<div><span>Filas en Supabase</span><b>${nf.format(e.count || 0)}</b></div><div><span>Última carga</span><b>${fdt(e.carga)}</b></div><div><span>Dato más reciente</span><b>${fdt(e.ultimo)}</b></div>`;
  }
}
let TARGET = null;
document.addEventListener("click", e => { const b = e.target.closest("[data-load]"); if (!b) return; TARGET = b.dataset.load; $("#fileIn").click(); });
$("#fileIn").addEventListener("change", async e => { const file = e.target.files[0]; e.target.value = ""; if (!file || !TARGET) return; await prepare(TARGET, file); });
/* Archivos grandes: se guarda el texto por líneas y cada lote se convierte justo antes de subirlo */
function splitLine(line){ return line.indexOf('"') < 0 ? line.split(",") : parseCSV(line)[0] || []; }
function makeRow(cfg, ix, cells){ const o = {}; for (const [dst, , t] of cfg.map) o[dst] = CONV[t](cells[ix[dst]]); return o; }
const tick = () => new Promise(r => setTimeout(r, 0));
async function prepare(tabla, file){
  const cfg = T[tabla], box = $("#x_" + tabla); box.innerHTML = `<div class="msg warn">Leyendo ${esc(file.name)}…</div>`;
  try {
    const text = await readFile(file);
    const lines = text.split(/\r?\n/); while (lines.length && !lines[lines.length - 1]) lines.pop();
    const h = splitLine(lines[0]).map(s => s.trim());
    const miss = cfg.map.filter(([, src]) => !h.includes(src)).map(m => m[1]);
    if (miss.length) throw new Error(`El archivo no tiene estas columnas: ${miss.join(", ")}. ¿Es el archivo correcto (${cfg.archivo})?`);
    const ix = Object.fromEntries(cfg.map.map(([dst, src]) => [dst, h.indexOf(src)]));
    /* fechas mínima y máxima del archivo */
    const fi = ix[cfg.fecha]; let fmin = null, fmax = null;
    for (let i = 1; i < lines.length; i++) { const f = CONV.ts(splitLine(lines[i])[fi]); if (!f) continue; if (!fmin || f < fmin) fmin = f; if (!fmax || f > fmax) fmax = f; if (i % 50000 === 0) await tick(); }
    const n = lines.length - 1, prev = lines.slice(1, 6).map(l => makeRow(cfg, ix, splitLine(l)));
    const plan = cfg.modo === "reemplazo" ? "Se borrará lo que hay hoy en la tabla y se cargará este archivo."
      : `Se reemplazarán en Supabase los datos desde el ${fdt(fmin).slice(0, 10)}; lo anterior a ${VENTANA_DIAS} días se pasa al histórico resumido.`;
    box.innerHTML = `<div class="msg ok"><b>${nf.format(n)} filas</b> listas · ${fmin ? `del ${fdt(fmin)} al ${fdt(fmax)}` : "sin fechas"}. ${plan}${cfg.nota ? " " + esc(cfg.nota) : ""}</div>
      <div class="tw"><table><thead><tr>${cfg.map.slice(0, 9).map(m => `<th>${esc(m[0])}</th>`).join("")}</tr></thead><tbody>${prev.map(r => `<tr>${cfg.map.slice(0, 9).map(m => `<td>${esc(r[m[0]] ?? "–")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="row"><button class="btn" type="button" id="go_${tabla}">Confirmar carga</button><button class="btn sec" type="button" id="no_${tabla}">Cancelar</button></div>`;
    $("#no_" + tabla).onclick = () => box.innerHTML = "";
    $("#go_" + tabla).onclick = () => upload(tabla, { lines, ix, n, fmin });
  } catch (err) { box.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
}
async function upload(tabla, job){
  const cfg = T[tabla], sb = LIPU.sb(), box = $("#x_" + tabla), bar = $("#b_" + tabla);
  $("#p_" + tabla).hidden = false; bar.style.width = "1%";
  const t0 = Date.now(), status = t => box.innerHTML = `<div class="msg warn">${t} No cierres esta página.</div>`;
  let i = 1;
  try {
    status("Preparando la tabla…");
    if (cfg.modo === "reemplazo") { const { error } = await sb.from(tabla).delete().gte("id", 0); if (error) throw error; }
    else if (job.fmin) {   /* borrar por día desde la fecha inicial del archivo para no duplicar */
      const d0 = new Date(job.fmin.slice(0, 10) + "T00:00:00Z"), hoy = new Date(Date.now() + 864e5);
      for (let d = d0; d <= hoy; d = new Date(d.getTime() + 864e5)) {
        const a = d.toISOString().slice(0, 10), b = new Date(d.getTime() + 864e5).toISOString().slice(0, 10);
        const { error } = await sb.from(tabla).delete().gte(cfg.fecha, a).lt(cfg.fecha, b); if (error) throw error;
        status(`Limpiando el ${a}…`);
      }
    }
    const N = 1000;
    for (; i < job.lines.length; i += N) {
      const batch = []; for (let j = i; j < Math.min(i + N, job.lines.length); j++) batch.push(makeRow(cfg, job.ix, splitLine(job.lines[j])));
      let error = null;
      for (let k = 0; k < 3; k++) { ({ error } = await sb.from(tabla).insert(batch)); if (!error) break; await new Promise(r => setTimeout(r, 1500 * (k + 1))); }
      if (error) throw error;
      const done = Math.min(i + N - 1, job.n), pct = done / job.n, seg = (Date.now() - t0) / 1000;
      bar.style.width = `${Math.max(1, pct * 100)}%`;
      status(`Cargando ${nf.format(done)} de ${nf.format(job.n)} filas (${Math.round(pct * 100)}%) · faltan ~${Math.ceil(seg / pct * (1 - pct) / 60)} min.`);
    }
    let extra = "";
    if (cfg.modo === "ventana") {
      status("Pasando al histórico lo anterior a la ventana…");
      const { data, error } = await sb.rpc("lipu_cerrar_ventana", { dias: VENTANA_DIAS });
      extra = error ? ` No se pudo cerrar la ventana: ${esc(error.message)}.` : ` Histórico: ${(data || []).map(r => `${r.tabla} ${nf.format(r.filas_borradas)} filas resumidas`).join(" · ")}.`;
    }
    box.innerHTML = `<div class="msg ok">Carga terminada: ${nf.format(job.n)} filas en <code>${tabla}</code> en ${Math.round((Date.now() - t0) / 60000)} min.${extra}</div>`;
    render();
  } catch (err) {
    box.innerHTML = `<div class="msg err">La carga se detuvo en la fila ${nf.format(i)}: ${esc(err.message || err)}. Vuelve a cargar el archivo: la carga reemplaza los mismos días, así que no se duplica.</div>`;
  }
}
(async () => {
  const u = await LIPU.user();
  if (!u) { $("#gate").hidden = false; $("#gate").innerHTML = `Inicia sesión en el <a href="../">portal</a> para usar esta página.`; return; }
  $("#who").textContent = u.email;
  if (!(await LIPU.isAdmin())) { $("#gate").hidden = false; $("#gate").textContent = "Solo los administradores pueden cargar datos."; return; }
  render();
})();
</script>
</body>
</html>
